<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Classroom Backend - Test Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .status-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        #slides-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .slide-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .slide-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .slide-card ul {
            list-style: none;
            padding-left: 0;
        }
        .slide-card li {
            padding: 5px 0;
            color: #555;
        }
        .slide-card li:before {
            content: "▸ ";
            color: #667eea;
            font-weight: bold;
        }
        #ws-messages {
            background: #1e293b;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #64748b;
        }
        .value {
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 AI Classroom Backend</h1>
        
        <div class="status-card">
            <span class="status-badge" id="status">Checking...</span>
            <div id="server-info"></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📚 Course Slides</h2>
                <p>View all deep learning slides</p>
                <button onclick="loadSlides()">Load Slides</button>
                <div id="slides-container"></div>
            </div>

            <div class="card">
                <h2>💬 Test Q&A (WebSocket)</h2>
                <input type="text" id="question" placeholder="Ask a question..." value="What is backpropagation?">
                <button onclick="askQuestion()">Ask Question</button>
                <div id="ws-messages"></div>
            </div>

            <div class="card">
                <h2>🔧 API Endpoints</h2>
                <button onclick="window.open('/slides', '_blank')">GET /slides</button>
                <button onclick="window.open('/slides/1', '_blank')">GET /slides/1</button>
                <button onclick="testHealth()">GET / (Health)</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;

        // Check server status on load
        async function checkStatus() {
            try {
                const response = await fetch('/');
                const data = await response.json();
                document.getElementById('status').textContent = '✓ Server Running';
                document.getElementById('server-info').innerHTML = `
                    <div class="info-row">
                        <span class="label">App:</span>
                        <span class="value">${data.app}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">LLM Model:</span>
                        <span class="value">${data.ollama_model}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">STT Model:</span>
                        <span class="value">${data.whisper_model}</span>
                    </div>
                `;
            } catch (error) {
                document.getElementById('status').textContent = '✗ Server Offline';
                document.getElementById('status').style.background = '#ef4444';
            }
        }

        async function loadSlides() {
            const container = document.getElementById('slides-container');
            container.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('/slides');
                const data = await response.json();
                
                container.innerHTML = '';
                data.slides.forEach(slide => {
                    const slideCard = document.createElement('div');
                    slideCard.className = 'slide-card';
                    slideCard.innerHTML = `
                        <h3>Slide ${slide.id}: ${slide.title}</h3>
                        <ul>
                            ${slide.bullets.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                    `;
                    container.appendChild(slideCard);
                });
            } catch (error) {
                container.innerHTML = '<p>Error loading slides</p>';
            }
        }

        function askQuestion() {
            const question = document.getElementById('question').value;
            const messagesDiv = document.getElementById('ws-messages');
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                const wsUrl = `ws://${window.location.host}/ws`;
                messagesDiv.innerHTML += `Connecting to ${wsUrl}...\n`;
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    messagesDiv.innerHTML += 'Connected!\n';
                    sendQuestion(question);
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    messagesDiv.innerHTML += `\n📥 Response: ${data.answer_text}\n`;
                    messagesDiv.innerHTML += `Confidence: ${(data.confidence * 100).toFixed(1)}%\n`;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                };
                
                ws.onerror = (error) => {
                    messagesDiv.innerHTML += `Error: ${error}\n`;
                };
            } else {
                sendQuestion(question);
            }
        }

        function sendQuestion(question) {
            const messagesDiv = document.getElementById('ws-messages');
            messagesDiv.innerHTML += `\n📤 Q: ${question}\n`;
            
            ws.send(JSON.stringify({
                type: 'student_question',
                text: question,
                current_slide_id: 5,
                timestamp: Date.now() / 1000
            }));
        }

        function testHealth() {
            checkStatus();
        }

        // Check status on load
        checkStatus();
    </script>
</body>
</html>
